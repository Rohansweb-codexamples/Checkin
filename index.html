<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Rohan's Hotel | Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#382414,#100e0c 55%,#080808);color:#fff;font-family:Arial,sans-serif;min-height:100vh}main{max-width:1100px;margin:auto;padding:28px 20px 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(140deg,#ffd18a,#ed781b);display:grid;place-items:center;color:#291606;font-weight:900}.brand h1{margin:0;font-size:clamp(24px,4vw,34px)}.brand p{margin:5px 0 0;color:#b8aaa0}.btn{border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(100deg,#f28c28,#ffc36b);color:#261507;font-weight:800;text-decoration:none;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.stat,.tablewrap{background:#151311;border:1px solid #3b2c20;border-radius:18px;padding:20px}.stat small{color:#b6a99e;font-size:13px}.stat strong{display:block;font-size:34px;margin-top:8px}.tablewrap{padding:0;overflow:hidden}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:16px 20px;border-bottom:1px solid #302820}th{color:#c6a47f;font-size:12px;text-transform:uppercase;letter-spacing:1px}td{font-size:15px}.pill{display:inline-block;border-radius:30px;padding:6px 11px;font-size:12px;font-weight:800}.in{background:#173a27;color:#a7edbd}.out{background:#4a2818;color:#ffc18a}.empty{text-align:center;color:#b8aaa0;padding:30px}#message{color:#ffb38a;margin:14px 0;min-height:20px}.actions{display:flex;gap:12px;align-items:center}@media(max-width:600px){.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:26px}th,td{padding:13px 10px;font-size:13px}.actions{width:100%}.actions .btn{flex:1;text-align:center}}
</style></head><body><main><div class="top"><div class="brand"><div class="logo">RH</div><div><h1>Rohan's Hotel</h1><p>Staff whereabouts · Admin</p></div></div><div class="actions"><a class="btn" href="kiosk.html">Open staff kiosk</a><button class="btn" id="refresh">Refresh</button></div></div><div class="stats"><div class="stat"><small>Total staff</small><strong id="total">—</strong></div><div class="stat"><small>In</small><strong id="in">—</strong></div><div class="stat"><small>Out</small><strong id="out">—</strong></div></div><div id="message">Loading staff information…</div><div class="tablewrap"><table><thead><tr><th>Member</th><th>Status</th><th>Where</th></tr></thead><tbody id="rows"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody></table></div></main><script>
const API='https://script.google.com/macros/s/AKfycbwhtQQ42ntsFmYzYfAf9pltKUQP3XH6bFkhajGldFrGW20g-VVQBSsBTR27DpV7L259/exec';
function api(action){return new Promise((resolve,reject)=>{const cb='adminCb'+Date.now()+Math.floor(Math.random()*9999),s=document.createElement('script'),timer=setTimeout(()=>{delete window[cb];s.remove();reject(Error('Connection timed out.'))},12000);window[cb]=d=>{clearTimeout(timer);delete window[cb];s.remove();d&&d.ok?resolve(d):reject(Error(d&&d.error||'Could not load data.'))};s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();reject(Error('Could not connect to Apps Script.'))};s.src=API+'?'+new URLSearchParams({action,callback:cb});document.body.appendChild(s)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const m=document.getElementById('message'),body=document.getElementById('rows');m.textContent='Updating…';try{const d=await api('admin'),a=d.staff||[],ins=a.filter(x=>x.status==='In').length,outs=a.length-ins;document.getElementById('total').textContent=a.length;document.getElementById('in').textContent=ins;document.getElementById('out').textContent=outs;body.innerHTML=a.length?a.map(x=>'<tr><td>'+esc(x.name)+'</td><td><span class="pill '+(x.status==='Out'?'out':'in')+'">'+x.status+'</span></td><td>'+esc(x.where||'—')+'</td></tr>').join(''):'<tr><td colspan="3" class="empty">No staff names yet. Add names in column A of your Google Sheet.</td></tr>';m.textContent='Live data from your Staff Movement sheet.'}catch(e){m.textContent=e.message;body.innerHTML='<tr><td colspan="3" class="empty">Could not load staff data. Check the Apps Script deployment and sheet connection.</td></tr>'}}
document.getElementById('refresh').onclick=load;load();setInterval(load,20000);
</script></body></html>
