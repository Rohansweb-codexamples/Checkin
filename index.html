<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171b55"><title>Rohan's Hotel | Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,Arial,sans-serif;background:linear-gradient(-45deg,#00c8ff,#7b2cff,#ff35b8,#254dff,#ff6ad5,#00e5ff);background-size:400% 400%;animation:bg 18s ease infinite}@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}main{max-width:1250px;margin:auto;padding:30px 22px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:15px}.logo{width:58px;height:58px;border-radius:19px;background:linear-gradient(135deg,#56d9ff,#bd75ff,#ff82ce);display:grid;place-items:center;color:#16143d;font-weight:950;font-size:20px;box-shadow:0 8px 30px #7d7aff66}.brand h1{margin:0;font-size:clamp(26px,4vw,38px)}.brand p{margin:6px 0 0;color:#e2d9ff}.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:15px;padding:15px 21px;background:linear-gradient(110deg,#00d9ff,#8b4dff,#ff45b8);color:#17143b;font-weight:900;text-decoration:none;cursor:pointer;font-size:15px;box-shadow:none}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.addbox,.stat,.tablewrap{background:#11164dbb;border:0;border-radius:22px;box-shadow:0 18px 55px #080b3040;backdrop-filter:blur(14px)}.addbox{margin-top:28px;padding:22px}.addbox h2{margin:0 0 14px;font-size:21px}.addrow{display:flex;gap:12px;flex-wrap:wrap}.addbox label{display:block;margin:14px 0 7px;font-weight:800}.addbox textarea{display:block;width:100%;min-height:90px;resize:vertical;border:1px solid #ffffff44;border-radius:14px;padding:14px;background:#ffffff12;color:white;font:inherit;margin-bottom:12px}.addbox textarea::placeholder{color:#c6c9e8}.addrow input{flex:1;min-width:210px;border:1px solid #ffffff44;border-radius:14px;padding:16px;background:#ffffff12;color:white;font-size:16px;outline:none}.addrow input::placeholder{color:#c6c9e8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.stat{padding:22px}.stat small{color:#d0c8f4;font-size:14px}.stat strong{display:block;font-size:38px;margin-top:8px}.tablewrap{overflow:hidden}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:18px 22px;border-bottom:1px solid #ffffff19}th{color:#c9c2f4;font-size:12px;text-transform:uppercase;letter-spacing:1px}td{font-size:16px}.pill{display:inline-block;border-radius:30px;padding:8px 14px;font-size:13px;font-weight:900}.in{background:#174b53;color:#9ff4ff}.out{background:#63305f;color:#ffc5ec}.empty{text-align:center;color:#d2cbed;padding:35px}#message{color:#fff;margin:16px 0;min-height:24px;font-weight:650}.error{color:#ffc2d9!important}.success{color:#aaf6ff!important}@media(max-width:650px){main{padding:20px 13px}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:28px}th,td{padding:14px 10px;font-size:13px}.actions{width:100%}.actions .btn{flex:1;text-align:center}}
</style></head><body><main>
<div class="top"><div class="brand"><div class="logo">RH</div><div><h1>Rohan's Hotel</h1><p>Staff management dashboard</p></div></div><div class="actions"><a class="btn" href="kiosk.html">Open staff kiosk</a><button class="btn" id="refresh">Refresh</button></div></div>
<section class="addbox"><h2>Add a staff member</h2><form class="addrow" id="addForm"><input id="newName" maxlength="120" placeholder="Enter staff member's name" autocomplete="off" required><button class="btn" type="submit" id="addBtn">+ Add staff</button></form></section>
<section class="addbox"><h2>Kiosk announcements & daily schedule</h2><form id="infoForm"><label for="announcements">Announcements</label><textarea id="announcements" rows="3" placeholder="Write important updates for staff"></textarea><label for="schedule">Daily schedule</label><textarea id="schedule" rows="5" placeholder="Add today's timings and activities"></textarea><button class="btn" id="saveInfo" type="submit">Save kiosk information</button></form></section>
<div class="stats"><div class="stat"><small>Total staff</small><strong id="total">—</strong></div><div class="stat"><small>In</small><strong id="in">—</strong></div><div class="stat"><small>Out</small><strong id="out">—</strong></div></div>
<div id="message">Connecting to staff sheet…</div><div class="tablewrap"><table><thead><tr><th>Member</th><th>Status</th><th>Where</th></tr></thead><tbody id="rows"><tr><td colspan="3" class="empty">Loading staff…</td></tr></tbody></table></div>
</main><script>
const API='https://script.google.com/macros/s/AKfycbwhtQQ42ntsFmYzYfAf9pltKUQP3XH6bFkhajGldFrGW20g-VVQBSsBTR27DpV7L259/exec';
function api(action,params={}){return new Promise((resolve,reject)=>{const cb='adminCb'+Date.now()+Math.floor(Math.random()*9999),s=document.createElement('script'),timer=setTimeout(()=>{delete window[cb];s.remove();reject(Error('Connection timed out.'))},15000);window[cb]=d=>{clearTimeout(timer);delete window[cb];s.remove();d&&d.ok?resolve(d):reject(Error(d&&d.error||'Request failed'))};s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();reject(Error('Could not connect to Apps Script. Check the deployment URL and access setting.'))};s.src=API+'?'+new URLSearchParams({action,callback:cb,...params});document.body.appendChild(s)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const m=document.getElementById('message'),body=document.getElementById('rows');m.className='';m.textContent='Updating staff…';try{const d=await api('admin'),a=d.staff||[],ins=a.filter(x=>x.status==='In').length;document.getElementById('total').textContent=a.length;document.getElementById('in').textContent=ins;document.getElementById('out').textContent=a.length-ins;body.innerHTML=a.length?a.map(x=>'<tr><td>'+esc(x.name)+'</td><td><span class="pill '+(x.status==='Out'?'out':'in')+'">'+x.status+'</span></td><td>'+esc(x.where||'—')+'</td></tr>').join(''):'<tr><td colspan="3" class="empty">No staff added yet. Add the first person above.</td></tr>';m.textContent='Connected · Live staff information';m.className='success'}catch(e){m.textContent=e.message;m.className='error';body.innerHTML='<tr><td colspan="3" class="empty">Could not load staff data. Apps Script may need redeploying.</td></tr>'}}
document.getElementById('addForm').addEventListener('submit',async e=>{e.preventDefault();const input=document.getElementById('newName'),btn=document.getElementById('addBtn'),m=document.getElementById('message'),name=input.value.trim();if(!name)return;btn.disabled=true;btn.textContent='Adding…';try{const d=await api('addstaff',{name});input.value='';m.textContent=d.message;m.className='success';await load()}catch(err){m.textContent=err.message;m.className='error'}finally{btn.disabled=false;btn.textContent='+ Add staff'}});
document.getElementById('infoForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('saveInfo'),m=document.getElementById('message');b.disabled=true;b.textContent='Saving…';try{const d=await api('saveinfo',{announcements:document.getElementById('announcements').value,schedule:document.getElementById('schedule').value});m.textContent=d.message;m.className='success'}catch(err){m.textContent=err.message;m.className='error'}finally{b.disabled=false;b.textContent='Save kiosk information'}});
async function loadInfo(){try{const d=await api('info');document.getElementById('announcements').value=d.info.announcements||'';document.getElementById('schedule').value=d.info.schedule||''}catch(e){document.getElementById('message').textContent=e.message;document.getElementById('message').className='error'}}
document.getElementById('refresh').onclick=load;load();loadInfo();setInterval(load,20000);
</script></body></html>
