<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#273b9b"><title>Rohan's Hotel | Staff Kiosk</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:white;font-family:Inter,Arial,sans-serif;background:linear-gradient(-45deg,#00c8ff,#7b2cff,#ff35b8,#254dff,#ff6ad5,#00e5ff);background-size:400% 400%;animation:bg 16s ease infinite}@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}main{max-width:1320px;min-height:100vh;margin:auto;padding:clamp(16px,3vw,38px);display:flex;flex-direction:column}header{text-align:center;padding:8px 0 25px}.mark{width:66px;height:66px;margin:0 auto 13px;border-radius:22px;background:linear-gradient(135deg,#63d9ff,#b17aff,#ff86d1);display:grid;place-items:center;color:#21194f;font-weight:950;font-size:22px;box-shadow:0 10px 35px #090d4066}h1{font-size:clamp(30px,5vw,48px);margin:0;text-shadow:0 3px 18px #080b4555}header p{color:#e3dcff;margin:9px 0;font-size:17px}.nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 auto 18px}.nav button{border:0;border-radius:15px;padding:13px 20px;background:linear-gradient(110deg,#00d9ff,#9b5cff,#ff48b8);color:#17143b;font-weight:900;font-size:15px;cursor:pointer}.info-view{max-width:980px;margin:0 auto 22px;padding:24px 28px;border-radius:24px;background:#25105c55;backdrop-filter:blur(8px)}.info-view h2{margin-bottom:12px}.info-copy{white-space:pre-wrap;line-height:1.6;font-size:17px;color:#fff}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.info-card{padding:20px;border-radius:20px;background:#25105c55}.info-card h3{margin:0 0 10px;font-size:21px}.info-card p{margin:0;white-space:pre-wrap;line-height:1.55;color:#f3eaff} .panel{width:100%;margin:auto;background:transparent;border:0;border-radius:0;padding:clamp(22px,4vw,42px);box-shadow:none;backdrop-filter:none}.step{color:#a9eaff;font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:13px;text-align:center}h2{font-size:clamp(25px,4vw,36px);margin:0 0 26px;text-align:center}.names,.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:17px}.name,.reason{border:0;border-radius:21px;background:linear-gradient(120deg,#00cfff,#654dff,#ed36d0,#ff5ebc);color:#fff;min-height:105px;padding:20px 15px;font-size:clamp(18px,2.1vw,23px);font-weight:850;cursor:pointer;box-shadow:none;transition:transform .18s,filter .18s}.name:hover,.reason:hover{transform:translateY(-3px) scale(1.015);filter:brightness(1.18)}.reason{min-height:112px;background:linear-gradient(120deg,#00cfff,#654dff,#ed36d0,#ff5ebc)}.reason span{display:block;font-size:14px;color:#e3dfff;font-weight:550;margin-top:8px}.actions{display:flex;gap:15px;justify-content:center;margin-top:26px;flex-wrap:wrap}.action{border:0;border-radius:16px;padding:17px 28px;font-size:17px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(110deg,#00d9ff,#9b5cff,#ff48b8);color:#191849}.secondary{background:linear-gradient(110deg,#375cff,#9b4dff);color:white}#message{min-height:26px;text-align:center;margin:18px 0 0;color:#fff;font-size:16px;font-weight:700}.error{color:#ffc2d9!important}.hidden{display:none!important}.busy{opacity:.6;pointer-events:none}footer{text-align:center;color:#e0d9ff;font-size:12px;margin-top:auto;padding:22px 0 3px;letter-spacing:1.4px}.success-screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;padding:25px;background:linear-gradient(135deg,#00aaff,#4255ff,#a52dff,#ff36b8);background-size:250% 250%;animation:successbg 3s ease infinite}.success-screen.hidden{display:none!important}@keyframes successbg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}.success-inner{max-width:800px}.success-icon{width:110px;height:110px;border:4px solid #ffffffbb;border-radius:50%;display:grid;place-items:center;margin:0 auto 28px;font-size:62px;font-weight:900;box-shadow:0 0 55px #ffffff44}.success-screen h2{font-size:clamp(38px,7vw,68px);margin:0 0 15px}.success-screen p{font-size:clamp(19px,3vw,27px);color:#eeeaff;margin:0}
@media(max-width:600px){.names,.reasons{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.name,.reason{min-height:88px;font-size:16px;padding:13px 8px}.reason span{font-size:12px}.panel{border-radius:23px;padding:20px 14px}.actions .action{flex:1}}
</style></head><body><main><header><div class="mark">RH</div><h1>Rohan's Hotel</h1><p>Staff sign-in & sign-out</p></header>
<nav class="nav" aria-label="Kiosk sections"><button type="button" data-view="checkin">Sign in / out</button><button type="button" data-view="announcements">Announcements</button><button type="button" data-view="schedule">Daily schedule</button><button type="button" data-view="staffinfo">Staff information</button></nav><section class="info-view hidden" id="infoView"><h2 id="infoTitle"></h2><div id="infoContent" class="info-copy"></div></section><section class="panel" id="panel"><div id="namesStep"><div class="step">Staff kiosk</div><h2>Tap your name to continue</h2><div class="names" id="names"><p>Loading staff…</p></div></div>
<div id="reasonStep" class="hidden"><div class="step">Signing out</div><h2 id="reasonHeading">Why are you going out?</h2><div class="reasons"><button class="reason" data-reason="Lunch">Lunch<span>Lunch break</span></button><button class="reason" data-reason="Break">Break<span>Taking a break</span></button><button class="reason" data-reason="Fresh air">Fresh air<span>Stepping outside</span></button><button class="reason" data-reason="Dinner">Dinner<span>Dinner break</span></button><button class="reason" data-reason="Breakfast">Breakfast<span>Breakfast break</span></button></div><div class="actions"><button class="action secondary" id="back">Back</button></div></div>
<div id="backStep" class="hidden"><div class="step">Welcome back</div><h2 id="backHeading">Are you back?</h2><p style="color:#e0dcff;text-align:center;font-size:18px">Confirm below to sign back in.</p><div class="actions"><button class="action primary" id="signIn">SIGN BACK IN</button><button class="action secondary" id="cancelBack">Back</button></div></div><div id="message" role="status" aria-live="polite"></div></section><footer>ROHAN'S HOTEL · STAFF KIOSK</footer></main>
<div class="success-screen hidden" id="successScreen"><div class="success-inner"><div class="success-icon">✓</div><h2 id="successTitle">Signed out!</h2><p id="successText">Have a good break.</p></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwhtQQ42ntsFmYzYfAf9pltKUQP3XH6bFkhajGldFrGW20g-VVQBSsBTR27DpV7L259/exec';let chosen='';const $=id=>document.getElementById(id);
function call(action,params={}){return new Promise((resolve,reject)=>{const cb='hotelCb'+Date.now()+Math.floor(Math.random()*9999),s=document.createElement('script'),timer=setTimeout(()=>{delete window[cb];s.remove();reject(Error('Connection timed out. Try again.'))},15000);window[cb]=d=>{clearTimeout(timer);delete window[cb];s.remove();d&&d.ok?resolve(d):reject(Error(d&&d.error||'Request failed'))};s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();reject(Error('Could not connect to Apps Script. Check that the latest Apps Script version is deployed for anyone.'))};s.src=API+'?'+new URLSearchParams({action,callback:cb,...params});document.body.appendChild(s)})}
function page(id){['namesStep','reasonStep','backStep'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function say(t,c=''){ $('message').textContent=t;$('message').className=c}function busy(v){$('panel').classList.toggle('busy',v)}
let kioskInfo={announcements:'No announcements at the moment.',schedule:'The daily schedule has not been added yet.'};
function showView(view){$('infoView').classList.toggle('hidden',view==='checkin');$('panel').classList.toggle('hidden',view!=='checkin');if(view==='announcements'||view==='schedule'){$('infoTitle').textContent=view==='announcements'?'Announcements':'Daily schedule';$('infoContent').textContent=kioskInfo[view]||'Nothing has been added yet.'}else if(view==='staffinfo'){$('infoTitle').textContent='Staff information';$('infoContent').textContent='Use Sign in / out to record when you leave and return. Choose the correct reason when signing out. If you need help, speak to the hotel manager.'}}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
async function loadInfo(){try{const d=await call('info');kioskInfo.announcements=d.info.announcements||'No announcements at the moment.';kioskInfo.schedule=d.info.schedule||'The daily schedule has not been added yet.'}catch(e){kioskInfo.announcements='Unable to load announcements.';kioskInfo.schedule='Unable to load the daily schedule.'}}
function confirmation(title,detail){$('successTitle').textContent=title;$('successText').textContent=detail;$('successScreen').classList.remove('hidden');setTimeout(()=>$('successScreen').classList.add('hidden'),3000)}
async function load(){try{const d=await call('staff'),root=$('names');root.innerHTML='';if(!d.staff.length){root.textContent='No staff names yet. Ask an administrator to add staff.';return}d.staff.forEach(n=>{const b=document.createElement('button');b.className='name';b.textContent=n;b.onclick=()=>pick(n);root.appendChild(b)})}catch(e){$('names').textContent=e.message+' ';const b=document.createElement('button');b.className='action secondary';b.textContent='Try again';b.onclick=load;$('names').appendChild(b)}}
async function pick(n){chosen=n;busy(true);say('');try{const d=await call('status',{name:n});if(d.isOut){$('backHeading').textContent='Welcome back, '+n;page('backStep')}else{$('reasonHeading').textContent='Why are you going out, '+n+'?';page('reasonStep')}}catch(e){say(e.message,'error')}finally{busy(false)}}
document.querySelectorAll('[data-reason]').forEach(b=>b.onclick=async()=>{busy(true);say('Saving…');try{const d=await call('signout',{name:chosen,reason:b.dataset.reason});const person=chosen;chosen='';page('namesStep');say('');confirmation('Signed out!',''+person+' · '+b.dataset.reason);await load()}catch(e){say(e.message,'error')}finally{busy(false)}});
$('back').onclick=$('cancelBack').onclick=()=>{page('namesStep');say('')};
$('signIn').onclick=async()=>{busy(true);say('Signing you back in…');try{const d=await call('signin',{name:chosen});const person=chosen;chosen='';page('namesStep');say('');confirmation('Signed back in!','Welcome back, '+person);await load()}catch(e){say(e.message,'error')}finally{busy(false)}};load();loadInfo();
</script></body></html>
