<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>Rohan's Hotel | Staff Kiosk</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#382414,#17110c 34%,#080808 72%);color:#fff;font-family:Arial,sans-serif}main{max-width:1000px;min-height:100vh;margin:auto;padding:clamp(16px,4vw,40px);display:flex;flex-direction:column}header{text-align:center;padding:12px 0 28px}.mark{width:54px;height:54px;margin:0 auto 14px;border-radius:17px;background:linear-gradient(145deg,#ffd18a,#ed781b);display:grid;place-items:center;color:#241306;font-weight:950;font-size:20px}h1{font-size:clamp(27px,5vw,42px);margin:0}header p{color:#b9ada2;margin:9px 0}.panel{max-width:820px;width:100%;margin:auto;background:#121110;border:1px solid #403024;border-radius:24px;padding:clamp(18px,3vw,30px);box-shadow:0 24px 80px #0008}.step{color:#ffc46b;font-size:12px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:12px}h2{font-size:clamp(21px,3vw,28px);margin:0 0 20px}.names,.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.name,.reason{border:1px solid #4a392b;border-radius:15px;background:linear-gradient(145deg,#24201c,#171513);color:#fff;min-height:70px;padding:14px;font-size:17px;font-weight:750;cursor:pointer}.name:hover,.reason:hover{border-color:#ff9b36;background:#302116}.reason{min-height:82px;background:#201a15}.reason span{display:block;font-size:12px;color:#c9a77f;font-weight:500;margin-top:6px}.actions{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}.action{border:0;border-radius:12px;padding:14px 22px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(100deg,#f28c28,#ffc36b);color:#241306}.secondary{background:#292522;color:white;border:1px solid #4a4038}#message{min-height:24px;text-align:center;margin:16px 0 0;color:#d6c4b2;font-size:14px}#message.error{color:#ff9a88}#message.good{color:#a9e6b5}.hidden{display:none!important}.busy{opacity:.6;pointer-events:none}footer{text-align:center;color:#766e66;font-size:11px;margin-top:auto;padding:24px 0 4px}@media(max-width:520px){.names,.reasons{grid-template-columns:repeat(2,minmax(0,1fr))}.name{font-size:15px;min-height:64px}}
</style></head><body><main><header><div class="mark">RH</div><h1>Rohan's Hotel</h1><p>Staff sign-out kiosk</p></header><section class="panel" id="panel"><div id="namesStep"><div class="step">Step 1</div><h2>Tap your name</h2><div class="names" id="names"><p>Loading staff…</p></div></div><div id="reasonStep" class="hidden"><div class="step">Step 2</div><h2 id="reasonHeading">Why are you going out?</h2><div class="reasons"><button class="reason" data-reason="Lunch">Lunch<span>Lunch break</span></button><button class="reason" data-reason="Break">Break<span>Taking a break</span></button><button class="reason" data-reason="Fresh air">Fresh air<span>Stepping outside</span></button><button class="reason" data-reason="Dinner">Dinner<span>Dinner break</span></button><button class="reason" data-reason="Breakfast">Breakfast<span>Breakfast break</span></button></div><div class="actions"><button class="action secondary" id="back">Back</button></div></div><div id="backStep" class="hidden"><div class="step">Welcome back</div><h2 id="backHeading">Are you back?</h2><p style="color:#b9ada2;text-align:center">Tap below when you return.</p><div class="actions"><button class="action primary" id="signIn">SIGN BACK IN</button><button class="action secondary" id="cancelBack">Back</button></div></div><div id="message" role="status" aria-live="polite"></div></section><footer>ROHAN'S HOTEL · STAFF KIOSK</footer></main><script>
const API='https://script.google.com/macros/s/AKfycbwhtQQ42ntsFmYzYfAf9pltKUQP3XH6bFkhajGldFrGW20g-VVQBSsBTR27DpV7L259/exec';let chosen='';const $=id=>document.getElementById(id);
function call(action,params={}){return new Promise((resolve,reject)=>{const cb='hotelCb'+Date.now()+Math.floor(Math.random()*9999),s=document.createElement('script'),timer=setTimeout(()=>{delete window[cb];s.remove();reject(Error('Connection timed out. Try again.'))},12000);window[cb]=d=>{clearTimeout(timer);delete window[cb];s.remove();d&&d.ok?resolve(d):reject(Error(d&&d.error||'Request failed'))};s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();reject(Error('Could not connect to Apps Script.'))};s.src=API+'?'+new URLSearchParams({action,callback:cb,...params});document.body.appendChild(s)})}
function page(id){['namesStep','reasonStep','backStep'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function say(t,c=''){ $('message').textContent=t;$('message').className=c}function busy(v){$('panel').classList.toggle('busy',v)}
async function load(){try{const d=await call('staff'),root=$('names');root.innerHTML='';if(!d.staff.length){root.textContent='No staff names found. Add names under MEMBER in your Google Sheet.';return}d.staff.forEach(n=>{const b=document.createElement('button');b.className='name';b.textContent=n;b.onclick=()=>pick(n);root.appendChild(b)})}catch(e){$('names').textContent=e.message+' ';const b=document.createElement('button');b.className='action secondary';b.textContent='Try again';b.onclick=load;$('names').appendChild(b)}}
async function pick(n){chosen=n;busy(true);say('');try{const d=await call('status',{name:n});if(d.isOut){$('backHeading').textContent='Welcome back, '+n;page('backStep')}else{$('reasonHeading').textContent='Why are you going out, '+n+'?';page('reasonStep')}}catch(e){say(e.message,'error')}finally{busy(false)}}
document.querySelectorAll('[data-reason]').forEach(b=>b.onclick=async()=>{busy(true);say('Saving…');try{const d=await call('signout',{name:chosen,reason:b.dataset.reason});say(d.message,'good');chosen='';page('namesStep');setTimeout(()=>say(''),2800)}catch(e){say(e.message,'error')}finally{busy(false)}});
$('back').onclick=$('cancelBack').onclick=()=>{page('namesStep');say('')};$('signIn').onclick=async()=>{busy(true);say('Signing you back in…');try{const d=await call('signin',{name:chosen});say(d.message,'good');chosen='';page('namesStep');setTimeout(()=>say(''),2800)}catch(e){say(e.message,'error')}finally{busy(false)}};load();
</script></body></html>
