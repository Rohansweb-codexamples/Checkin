<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3624a8"><title>Rohan's Hotel OS</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,Arial,sans-serif;background:linear-gradient(-45deg,#00cfff,#563cff,#f52eae,#284dff,#ff70bd);background-size:400% 400%;animation:bg 18s ease infinite}@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}button,input{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.shell{max-width:1180px;margin:auto;padding:24px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:13px}.logo{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,#fff,#9deaff,#ffb5e9);color:#34218c;display:grid;place-items:center;font-weight:1000}.brand h1{font-size:23px;margin:0}.brand p{margin:4px 0 0;color:#eee5ff}.clock{text-align:right;font-weight:850}.clock small{display:block;font-weight:500;color:#eee5ff;margin-top:4px}.glass{background:#17104b55;border:1px solid #ffffff25;border-radius:28px;backdrop-filter:blur(14px);box-shadow:0 18px 55px #14084b22}.lock{max-width:470px;margin:9vh auto;padding:36px;text-align:center}.lock .logo{width:76px;height:76px;margin:0 auto 18px;font-size:24px}.lock h2{font-size:32px;margin:10px 0}.lock p{color:#eee5ff}.pin{width:100%;padding:18px;border:2px solid #ffffff55;border-radius:17px;background:#ffffff18;color:#fff;text-align:center;font-size:28px;letter-spacing:10px;outline:none}.pin::placeholder{color:#e4dcff;letter-spacing:3px;font-size:16px}.primary,.tile,.reason,.soft{border:0;border-radius:17px;font-weight:900}.primary{width:100%;padding:17px;margin-top:14px;background:linear-gradient(110deg,#00e3ff,#a35bff,#ff55bd);color:#21144d}.error{color:#ffe0f1;min-height:24px;margin-top:12px}.welcome{margin:28px 0 22px;padding:23px 26px}.welcome h2{margin:0;font-size:clamp(25px,4vw,36px)}.welcome p{margin:7px 0 0;color:#eee5ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.tile{min-height:150px;padding:22px;text-align:left;color:white;background:linear-gradient(135deg,#3827a9cc,#8a36cacc,#ed35aacc);box-shadow:0 10px 28px #12094a22;transition:.2s}.tile:hover{transform:translateY(-4px);filter:brightness(1.12)}.tile .ico{font-size:32px;display:block;margin-bottom:14px}.tile strong{font-size:19px;display:block}.tile small{display:block;color:#f0e8ff;margin-top:7px;font-size:13px}.app{padding:25px;margin-top:20px}.apphead{display:flex;justify-content:space-between;align-items:center;gap:12px}.apphead h2{margin:0;font-size:27px}.soft{padding:12px 17px;background:#ffffff26;color:white}.copy{white-space:pre-wrap;line-height:1.65;color:#fff;font-size:17px;margin-top:18px}.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}.reason{padding:20px 12px;min-height:76px;color:#fff;background:linear-gradient(110deg,#00bfe9,#6547e9,#e934b5)}.reason small{display:block;font-weight:500;margin-top:5px;color:#f0e5ff}.rowbtn{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.rowbtn button{flex:1;min-width:140px;padding:16px}.success{padding:24px;text-align:center;margin-top:18px;font-size:19px;font-weight:800}.footer{text-align:center;color:#f1eaff;font-size:12px;padding:28px 0 8px}@media(max-width:600px){.shell{padding:15px}.lock{margin:8vh auto;padding:25px 18px}.tile{min-height:125px}.clock{font-size:14px}}
</style></head><body><div class="shell">
<header class="top"><div class="brand"><div class="logo">RH</div><div><h1>Rohan's Hotel OS</h1><p>Staff workspace</p></div></div><div class="clock"><span id="time">--:--</span><small id="date"></small></div></header>
<section id="lock" class="glass lock"><div class="logo">RH</div><div class="step">SECURE STAFF LOGIN</div><h2>Welcome back</h2><p>Enter the staff PIN to continue.</p><form id="loginForm"><input class="pin" id="pin" type="password" inputmode="numeric" pattern="1234" maxlength="4" placeholder="Enter PIN" autocomplete="off" required><button class="primary" id="loginBtn">CONTINUE</button></form><div id="loginError" class="error"></div><form id="staffForm" class="hidden"><p>Choose your name to open your workspace.</p><select id="staffChoice" class="pin" style="letter-spacing:0;font-size:18px" required><option value="">Choose your name</option></select><button class="primary">OPEN WORKSPACE</button></form></section>
<section id="desktop" class="hidden"><div class="glass welcome"><h2 id="hello">Welcome</h2><p>Your hotel workspace is ready. Choose an app below.</p></div>
<div id="home" class="grid">
<button class="tile" data-app="attendance"><span class="ico">◷</span><strong>Staff check-in</strong><small>Sign out for a break or sign back in</small></button>
<button class="tile" data-app="announcements"><span class="ico">▤</span><strong>Announcements</strong><small>Hotel news and important updates</small></button>
<button class="tile" data-app="schedule"><span class="ico">▦</span><strong>Daily schedule</strong><small>Today's timings and activities</small></button>
<button class="tile" data-app="directory"><span class="ico">♙</span><strong>Staff information</strong><small>Helpful staff guidance</small></button>
<button class="tile" data-app="account"><span class="ico">⚙</span><strong>My account</strong><small>Signed-in account and lock screen</small></button>
</div>
<section id="app" class="glass app hidden"><div class="apphead"><h2 id="appTitle">App</h2><button class="soft" id="homeBtn">← Home</button></div><div id="appBody" class="copy"></div></section><div id="actionMessage" class="glass success hidden"></div>
</section><div class="footer">ROHAN'S HOTEL OS · STAFF PORTAL</div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwX_YPOlk8NnLgog41S49VWvOXNSksHJwsXK8_uNmpRFZolQOSyWnlAuM90u7H60ztZ/exec';let currentName='',info={announcements:'No announcements have been published.',schedule:'No schedule has been published.'},currentStatus=null;const $=id=>document.getElementById(id);
function api(action,params={}){return new Promise((resolve,reject)=>{const cb='osCb'+Date.now()+Math.floor(Math.random()*9999),s=document.createElement('script'),t=setTimeout(()=>{delete window[cb];s.remove();reject(Error('Connection timed out.'))},15000);window[cb]=d=>{clearTimeout(t);delete window[cb];s.remove();d&&d.ok?resolve(d):reject(Error(d?.error||'Request failed'))};s.onerror=()=>{clearTimeout(t);delete window[cb];s.remove();reject(Error('Could not connect to the staff server. Please ask an administrator to check the Apps Script deployment.'))};s.src=API+(API.includes('?')?'&':'?')+new URLSearchParams({action,callback:cb,...params});document.body.appendChild(s)})}
function tick(){const d=new Date();$('time').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('date').textContent=d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}tick();setInterval(tick,1000);
async function loadInfo(){const d=await api('info');info=d.info}
$('loginForm').onsubmit=async e=>{e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='Checking PIN…';$('loginError').textContent='';try{await api('pinlogin',{pin:$('pin').value});const d=await api('staff');const sel=$('staffChoice');sel.innerHTML='<option value="">Choose your name</option>'+(d.staff||[]).map(n=>'<option value="'+String(n).replace(/[&<>"']/g,'')+'">'+String(n).replace(/[&<>"']/g,'')+'</option>').join('');if(!(d.staff||[]).length)throw Error('No staff names found in the sheet.');$('loginForm').classList.add('hidden');$('staffForm').classList.remove('hidden');$('loginError').textContent='PIN accepted. Now choose your name.';$('pin').value=''}catch(err){$('loginError').textContent=err.message;$('pin').value=''}finally{b.disabled=false;b.textContent='CONTINUE'}};$('staffForm').onsubmit=async e=>{e.preventDefault();currentName=$('staffChoice').value;if(!currentName){$('loginError').textContent='Please choose your name.';return}$('hello').textContent='Hello, '+currentName;$('lock').classList.add('hidden');$('desktop').classList.remove('hidden');$('staffForm').classList.add('hidden');$('loginForm').classList.remove('hidden');$('staffChoice').value='';await loadInfo()};
document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app));$('homeBtn').onclick=()=>{$('app').classList.add('hidden');$('home').classList.remove('hidden')};
async function openApp(name){$('home').classList.add('hidden');$('app').classList.remove('hidden');$('actionMessage').classList.add('hidden');const body=$('appBody');body.innerHTML='';if(name==='announcements'||name==='schedule'){try{await loadInfo()}catch(e){}$('appTitle').textContent=name==='announcements'?'Announcements':'Daily schedule';body.textContent=info[name==='announcements'?'announcements':'schedule']||'Nothing has been published yet.'}
else if(name==='directory'){$('appTitle').textContent='Staff information';body.textContent='Use Staff check-in to record when you leave and return. Choose the correct reason when signing out. For help with your shift, speak to the hotel manager.'}
else if(name==='account'){$('appTitle').textContent='My account';body.textContent='Signed in as '+currentName+'. Your personal PIN is not displayed. Lock the workspace when you have finished using the kiosk.';body.innerHTML+='<div class="rowbtn"><button class="primary" id="lockNow">LOCK WORKSPACE</button></div>';document.getElementById('lockNow').onclick=lockOS}
else if(name==='attendance'){ $('appTitle').textContent='Staff check-in';try{const d=await api('status',{name:currentName});currentStatus=d;body.textContent=d.isOut?'You are currently signed out: '+d.where+'.':'You are currently signed in.';if(d.isOut){body.innerHTML+='<div class="rowbtn"><button class="primary" id="backIn">SIGN BACK IN</button></div>';document.getElementById('backIn').onclick=signInNow}else{body.innerHTML+='<p>Choose why you are leaving:</p><div class="reasons">'+['Lunch','Break','Fresh air','Dinner','Breakfast'].map(x=>'<button class="reason" data-reason="'+x+'">'+x+'</button>').join('')+'</div>';body.querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>signOutNow(b.dataset.reason))}}catch(e){body.textContent=e.message}}}
async function signOutNow(reason){try{await api('signout',{name:currentName,reason});$('appBody').textContent='You are signed out for '+reason+'. Have a good break.'}catch(e){$('appBody').textContent=e.message}}
async function signInNow(){try{await api('signin',{name:currentName});$('appBody').textContent='You are signed back in. Welcome back!'}catch(e){$('appBody').textContent=e.message}}
function lockOS(){currentName='';$('desktop').classList.add('hidden');$('app').classList.add('hidden');$('home').classList.remove('hidden');$('lock').classList.remove('hidden');$('pin').value='';$('loginError').textContent=''}
</script></body></html>
